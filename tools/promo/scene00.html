<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="stage.css">
<style>
  .title-wrap{opacity:0;transform:translateY(14px)}
  .icon-wrap{opacity:0;transform:scale(.9)}
  .sub-wrap{opacity:0;transform:translateY(10px)}
  .tag-wrap{position:absolute;bottom:40px;left:0;right:0;text-align:center;opacity:0}
</style></head>
<body>
<div class="stage" id="stage">
  <div class="bgimg"></div>
  <div class="center">
    <div class="icon-wrap" id="icon"><div class="icon-tile"><img src="icon.svg" alt=""></div></div>
    <div class="title-wrap" id="title"><div class="title">dsh-appearance-glass</div></div>
    <div class="sub-wrap" id="sub">
      <div class="sub">介面<b>透明度</b>：四個分區各自可調，滑桿數字就是實際看到的透明度</div>
      <div class="en">Interface transparency for DeepSeek Harness · four independent opacity regions</div>
    </div>
  </div>
  <div class="tag-wrap" id="tag"><div class="tag">DSH plugin · open source · MIT</div></div>
</div>
<script>
window.__duration = 4.6
const ease = (x) => 1 - Math.pow(1 - Math.max(0, Math.min(1, x)), 3)
const ramp = (t, a, b) => ease((t - a) / (b - a))
const $ = (id) => document.getElementById(id)
window.__render = (t) => {
  // 整幕緩慢推近
  const push = 1 + 0.03 * (t / window.__duration)
  $('stage').style.transform = `scale(${push})`
  $('stage').style.transformOrigin = '50% 50%'
  const i = ramp(t, 0.35, 1.25)
  $('icon').style.opacity = i
  $('icon').style.transform = `scale(${0.9 + 0.1 * i})`
  const ti = ramp(t, 0.9, 1.9)
  $('title').style.opacity = ti
  $('title').style.transform = `translateY(${14 * (1 - ti)}px)`
  const s = ramp(t, 1.5, 2.5)
  $('sub').style.opacity = s
  $('sub').style.transform = `translateY(${10 * (1 - s)}px)`
  const g = ramp(t, 2.9, 3.6)
  $('tag').style.opacity = g * 0.9
}
</script></body></html>
